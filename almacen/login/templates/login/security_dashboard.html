<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Seguridad</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .log-entry { border-bottom: 1px solid #333; padding: 10px; margin: 5px 0; }
        .CRITICAL { color: #f48771; background: #5a1e1e; }
        .WARNING { color: #ffd700; }
        .ERROR { color: #f48771; }
        .INFO { color: #4ec9b0; }
        pre { background: #252526; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔒 Bitácora de Seguridad</h1>
    <div id="logs">
        <!-- Aquí se mostrarían los logs parseados -->
        <pre>Revisar archivo: logs/security/security.log</pre>
    </div>
</body>
</html>
